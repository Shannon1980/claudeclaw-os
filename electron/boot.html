<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>ClaudeClaw</title>
    <style>
      /* Flat, dark-first, sentence case — inherits the dashboard's language.
         No gradients or shadows; colors via variables. */
      :root {
        --bg: #0b0d12;
        --fg: #e7e9ee;
        --muted: #8a90a0;
        --accent: #7c8cff;
        --track: #20242e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 32px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--track);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #dfe3ff;
        background: linear-gradient(135deg, #2c3358 0%, #171b2c 45%, #0a0c13 100%);
      }
      .mark svg { width: 26px; height: 26px; }
      h1 {
        font-size: 17px;
        font-weight: 500;
        margin: 0;
        letter-spacing: 0.2px;
      }
      p {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
        margin: 0;
        max-width: 380px;
        line-height: 1.5;
      }
      .bar {
        width: 200px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
        position: relative;
      }
      .bar > span {
        position: absolute;
        left: -40%;
        width: 40%;
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      .hidden { display: none; }
      button {
        margin-top: 6px;
        padding: 8px 18px;
        font-size: 13px;
        font-family: inherit;
        color: var(--fg);
        background: var(--track);
        border: 1px solid var(--track);
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg viewBox="222 147 740 740" fill="currentColor" aria-hidden="true">
          <g transform="translate(512 512) rotate(28)">
            <path opacity="0.72" transform="translate(-200 -14) rotate(-6)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
            <path opacity="0.88" transform="translate(6 24) scale(1.13)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
            <path transform="translate(210 8) rotate(6) scale(1.05)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
          </g>
        </svg>
      </div>
      <h1 id="title">Starting ClaudeClaw</h1>
      <p id="detail">Bringing your assistant online…</p>
      <div class="bar" id="bar"><span></span></div>
      <button id="retry" class="hidden">Try again</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const state = params.get('state') || 'starting';
      const detail = params.get('detail') || '';
      const title = document.getElementById('title');
      const detailEl = document.getElementById('detail');
      const bar = document.getElementById('bar');
      const retry = document.getElementById('retry');

      const copy = {
        starting: {
          title: 'Starting ClaudeClaw',
          detail: 'Bringing your assistant online…',
          bar: true,
        },
        migrating: {
          title: 'Updating your assistant',
          detail: 'Applying database updates. This only takes a moment…',
          bar: true,
        },
        'migrating-failed': {
          title: 'Update did not finish',
          detail: 'A database update could not be applied. You can try again.',
          bar: false,
          retry: true,
        },
        'needs-setup': {
          title: 'Almost there',
          detail: 'Your assistant is not set up yet. Onboarding is coming next.',
          bar: false,
        },
        error: {
          title: 'Could not start',
          detail: 'Something went wrong bringing the assistant online.',
          bar: false,
        },
      };

      const c = copy[state] || copy.starting;
      title.textContent = c.title;
      detailEl.textContent = detail || c.detail;
      if (!c.bar) bar.classList.add('hidden');
      if (c.retry) {
        retry.classList.remove('hidden');
        retry.addEventListener('click', () => {
          retry.disabled = true;
          if (window.claudeclaw && window.claudeclaw.boot) {
            window.claudeclaw.boot.retryMigration();
          }
        });
      }
    </script>
  </body>
</html>
