<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="no-referrer" />
    <title>Mission Control · ClaudeClaw</title>
    <script>
      // Apply theme before render to avoid FOUC.
      try {
        const saved = localStorage.getItem('claudeclaw.theme');
        if (saved === 'midnight' || saved === 'crimson' || saved === 'graphite') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch {}
    </script>
  </head>
  <body>
    <!-- Brand mark held on screen until Preact mounts, so the first paint is
         the logo rather than an empty shell. main.tsx removes it after render.
         Colors are hardcoded: the CSS bundle (and its variables) has not
         loaded yet at this point. Every theme is dark, so this is safe. -->
    <div id="boot-splash">
      <div class="boot-splash-tile">
        <svg viewBox="222 147 740 740" fill="currentColor" aria-hidden="true">
          <g transform="translate(512 512) rotate(28)">
            <path opacity="0.72" transform="translate(-200 -14) rotate(-6)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
            <path opacity="0.88" transform="translate(6 24) scale(1.13)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
            <path transform="translate(210 8) rotate(6) scale(1.05)" d="M -62 -230 C -44 -92, 6 74, 56 248 C 24 68, 40 -88, 62 -228 Q 0 -266, -62 -230 Z"/>
          </g>
        </svg>
      </div>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
      }
      .boot-splash-tile {
        width: 48px;
        height: 48px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #dfe3ff;
        background: linear-gradient(135deg, #2c3358 0%, #171b2c 45%, #0a0c13 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        animation: boot-splash-pulse 1.4s ease-in-out infinite;
      }
      .boot-splash-tile svg { width: 30px; height: 30px; }
      @keyframes boot-splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-tile { animation: none; }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
