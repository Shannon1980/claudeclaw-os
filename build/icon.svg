<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- ClaudeClaw app icon. Three claw rakes across a dark tile.
       Mark fills ~69% of the tile height, optically centred on the macOS icon grid. -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2c3358"/>
      <stop offset="0.45" stop-color="#171b2c"/>
      <stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="claw" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#dfe3ff"/>
      <stop offset="0.72" stop-color="#a3adff"/>
      <stop offset="1" stop-color="#7c88f6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.48  0 0 0 0 1  0 0 0 0.8 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One rake: blunt where the claw enters, razor tip where it leaves. -->
    <path id="rake" d="M -62 -230
      C -44 -92, 6 74, 56 248
      C 24 68, 40 -88, 62 -228
      Q 0 -266, -62 -230 Z"/>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#tile)"/>
  <rect x="97.5" y="97.5" width="829" height="829" rx="189" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g transform="translate(447 508) rotate(28) scale(0.82)" filter="url(#glow)" fill="url(#claw)">
    <use href="#rake" transform="translate(-200 -14) rotate(-6)"/>
    <use href="#rake" transform="translate(6 24) scale(1.13)"/>
    <use href="#rake" transform="translate(210 8) rotate(6) scale(1.05)"/>
  </g>
</svg>
