<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c3e"/>
      <stop offset="0.55" stop-color="#141826"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#cdd5ff"/>
      <stop offset="0.45" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#4a57c8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- One talon: blunt rounded base at top, sharp curved tip at bottom -->
    <path id="talon" d="M 482 350
      Q 512 322 542 350
      Q 560 540 518 712
      L 512 728 L 506 712
      Q 464 540 482 350 Z"/>
  </defs>

  <!-- App tile -->
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#sheen)"/>
  <rect x="98.5" y="98.5" width="827" height="827" rx="187.5" fill="none" stroke="#7c8cff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Claw swipe: three separated talons splayed outward -->
  <g filter="url(#glow)" fill="url(#claw)">
    <use href="#talon" transform="translate(-150 36) rotate(-17 512 540)"/>
    <use href="#talon" transform="translate(0 -10)"/>
    <use href="#talon" transform="translate(150 36) rotate(17 512 540)"/>
  </g>
</svg>
